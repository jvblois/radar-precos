name: Coleta de preços

on:
  schedule:
    # 9h e 21h no horário de Brasília (12h e 0h UTC)
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "coletor/**"
      - "config/**"
      - ".github/workflows/coleta.yml"

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar preços
        run: python coletor/coletar.py

      - name: Salvar dados no repositório
        run: |
          git config user.name "radar-precos-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add data/
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Coleta $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            git push
          fi
